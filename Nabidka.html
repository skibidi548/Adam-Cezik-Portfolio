<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inzerát – Nabízím</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --badge-bg: #dbeafe;
            --badge-text: #1e40af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .ad-card {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .ad-image-wrapper {
            position: relative;
            width: 100%;
            height: 300px;
            background-color: #e5e7eb;
        }

        .ad-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .ad-badge {
            position: absolute;
            top: 16px;
            left: 16px;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .ad-content {
            padding: 28px;
        }

        .ad-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 16px;
        }

        .ad-title {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .ad-price {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-color);
            white-space: nowrap;
        }

        .ad-description {
            color: #4b5563;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .ad-details {
            list-style: none;
            background-color: #f9fafb;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .ad-details li {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.95rem;
            border-bottom: 1px solid #f3f4f6;
        }

        .ad-details li:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-muted);
        }

        .detail-value {
            font-weight: 600;
        }

        .ad-footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
