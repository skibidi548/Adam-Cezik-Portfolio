<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezervace natáčení DJI | Adam Čežík</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Doplňkové styly jen pro rezervační widget – ideálně přesuň do css/style.css */
        .booking-box {
            display: grid;
            grid-template-columns: 1.3fr 0.9fr;
            gap: 24px;
            margin-top: 24px;
        }

        .booking-card {
            background: rgba(19, 26, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
        }

        .booking-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field label {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        .field input,
        .field select,
        .field textarea {
            background: #0b1020;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: inherit;
        }

        .time-slots {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .slot-btn {
            background: #0b1020;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-family: inherit;
        }

        .slot-btn.active {
            background: #6366f1;
            border-color: #818cf8;
            color: #fff;
        }

        .summary-line {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
        }

        .booking-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-primary-booking {
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-secondary-booking {
            background: transparent;
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 600;
            cursor: pointer;
        }

        #booking-status {
            margin-top: 14px;
            font-size: 0.9rem;
            color: #a5b4fc;
        }

        @media (max-width: 820px) {
            .booking-box,
            .booking-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Sem vlož svůj <header> z index.html / Projekty.html -->

    <main>
        <h1>Rezervace natáčení kamerou DJI</h1>
        <p>Vyber si den, čas schůzky a orientační délku natáčení – přímo tady si složíš poptávku.</p>

        <div class="booking-box">
            <!-- Levá část: Kalendář / datum, čas a detaily -->
            <section class="booking-card">
                <h2>1. Vyber termín a čas</h2>

                <div class="booking-grid">
                    <div class="field">
                        <label for="datum">Datum (kalendář)</label>
                        <input type="date" id="datum" name="datum">
                    </div>

                    <div class="field">
                        <label for="delka">Délka natáčení</label>
                        <select id="delka" name="delka">
                            <option value="1 hodina">1 hodina</option>
                            <option value="2 hodiny">2 hodiny</option>
                            <option value="3 hodiny">3 hodiny</option>
                            <option value="Dle domluvy">Dle domluvy</option>
                        </select>
                    </div>
                </div>

                <div class="field" style="margin-top: 16px;">
                    <label>Čas schůzky / začátku</label>
                    <div class="time-slots" id="timeSlots">
                        <button type="button" class="slot-btn active" data-time="10:00">10:00</button>
                        <button type="button" class="slot-btn" data-time="13:00">13:00</button>
                        <button type="button" class="slot-btn" data-time="15:30">15:30</button>
                        <button type="button" class="slot-btn" data-time="17:30">17:30</button>
                    </div>
                </div>

                <div class="booking-grid">
                    <div class="field">
                        <label for="lokalita">Místo / lokalita</label>
                        <input type="text" id="lokalita" placeholder="Např. Most / okolí / dle domluvy">
                    </div>

                    <div class="field">
                        <label for="jmeno">Tvoje jméno nebo přezdívka</label>
                        <input type="text" id="jmeno" placeholder="Jak ti mám říkat?">
                    </div>
                </div>

                <div class="field" style="margin-top: 16px;">
                    <label for="poznamka">Co budeme točit / poznámka</label>
                    <textarea id="poznamka" rows="3" placeholder="Napiš krátce, o jaké natáčení jde..."></textarea>
                </div>
            </section>

            <!-- Pravá část: Přehled jako na Bookingu -->
            <aside class="booking-card">
                <h2>2. Přehled termínu</h2>
                <p>Zkontroluj si vybrané údaje před odesláním.</p>

                <div style="margin-top: 16px;">
                    <div class="summary-line">
                        <span>Služba</span>
                        <strong>Natáčení kamerou DJI</strong>
                    </div>
                    <div class="summary-line">
                        <span>Datum</span>
                        <strong id="sumDatum">Nevybráno</strong>
                    </div>
                    <div class="summary-line">
                        <span>Čas</span>
                        <strong id="sumCas">10:00</strong>
                    </div>
                    <div class="summary-line">
                        <span>Délka</span>
                        <strong id="sumDelka">1 hodina</strong>
                    </div>
                    <div class="summary-line">
                        <span>Místo</span>
                        <strong id="sumLokalita">Dle domluvy</strong>
                    </div>
                </div>

                <div class="booking-actions">
                    <button type="button" class="btn-primary-booking" id="sendMailBtn">Odeslat poptávku e-mailem</button>
                    <button type="button" class="btn-secondary-booking" id="copyTextBtn">Zkopírovat text termínu</button>
                </div>

                <p id="booking-status"></p>
            </aside>
        </div>
    </main>

    <!-- Sem vlož svoji patičku (footer) -->

    <script>
        const datumInput = document.getElementById('datum');
        const delkaInput = document.getElementById('delka');
        const lokalitaInput = document.getElementById('lokalita');
        const jmenoInput = document.getElementById('jmeno');
        const poznamkaInput = document.getElementById('poznamka');
        const slotButtons = document.querySelectorAll('.slot-btn');

        const sumDatum = document.getElementById('sumDatum');
        const sumCas = document.getElementById('sumCas');
        const sumDelka = document.getElementById('sumDelka');
        const sumLokalita = document.getElementById('sumLokalita');
        const statusEl = document.getElementById('booking-status');

        let selectedTime = '10:00';

        // Nastaví minimální datum na dnešek
        const today = new Date().toISOString().split('T')[0];
        datumInput.min = today;
        datumInput.value = today;

        function updateSummary() {
            sumDatum.textContent = datumInput.value || 'Nevybráno';
            sumCas.textContent = selectedTime;
            sumDelka.textContent = delkaInput.value;
            sumLokalita.textContent = lokalitaInput.value.trim() || 'Dle domluvy';
        }

        slotButtons.forEach((btn) => {
            btn.addEventListener('click', () => {
                slotButtons.forEach((b) => b.classList.remove('active'));
                btn.classList.add('active');
                selectedTime = btn.dataset.time;
                updateSummary();
            });
        });

        [datumInput, delkaInput, lokalitaInput].forEach((el) => {
            el.addEventListener('input', updateSummary);
            el.addEventListener('change', updateSummary);
        });

        function buildMessage() {
            return [
                'Poptávka na natáčení kamerou DJI',
                `Datum: ${datumInput.value || 'neuvedeno'}`,
                `Čas: ${selectedTime}`,
                `Délka: ${delkaInput.value}`,
                `Lokalita: ${lokalitaInput.value.trim() || 'dle domluvy'}`,
                `Jméno: ${jmenoInput.value.trim() || 'neuvedeno'}`,
                `Poznámka: ${poznamkaInput.value.trim() || 'bez poznámky'}`
            ].join('\n');
        }

        document.getElementById('copyTextBtn').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(buildMessage());
                statusEl.textContent = 'Text rezervace zkopírován do schránky – můžeš ho rovnou poslat.';
            } catch {
                statusEl.textContent = 'Nepodařilo se zkopírovat automaticky, vyber text ručně.';
            }
        });

        document.getElementById('sendMailBtn').addEventListener('click', () => {
            const subject = encodeURIComponent(`Rezervace natáčení DJI (${datumInput.value || 'termín'} ${selectedTime})`);
            const body = encodeURIComponent(buildMessage());
            window.location.href = `mailto:tvuj-email@domena.cz?subject=${subject}&body=${body}`;
            statusEl.textContent = 'Otevírám e-mailového klienta s předvyplněným termínem.';
        });

        updateSummary();
    </script>
</body>
</html>
